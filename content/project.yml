teaser:
  image: /images/teaserulvn.png
  alt: Overview of unordered landmark visual navigation from image collections to
    RGB-only planning and replanning
  caption: >
    ULVN builds a navigable topological graph directly from unordered RGB
    images, then performs vision-only localization, planning, and dynamic
    replanning without odometry, depth, LiDAR, or temporal capture priors.
abstract: Image-goal navigation is a fundamental capability for embodied AI, yet
  most existing systems rely on temporally ordered video streams, odometry,
  depth, or LiDAR to preserve spatial consistency. These assumptions restrict
  deployment when robots must operate from crowd-sourced or pre-recorded
  unordered image collections. We propose **Unordered Landmark Visual Navigation
  (ULVN)**, a unified RGB-only framework that integrates mapping, localization,
  and planning without temporal or multimodal priors. ULVN constructs a robust
  2D topological map from unstructured images through calibrated visual place
  retrieval, geometric verification, maximum spanning forest refinement, and
  loop reinsertion. During closed-loop execution, a graph-based belief
  propagation localization filter uses entropy-adaptive fusion to track the
  robot under perceptual ambiguity, while belief-aware subgoal search plans and
  replans over the graph. Experiments in simulation and real-world robot
  deployments show that ULVN substantially improves mapping quality,
  localization robustness, and navigation success over strong baselines.
sections:
  - title: Method
    body: >-
      ULVN contains three coupled components.


      **RAVEL** converts unordered images into a reliable landmark graph. It
      uses visual place retrieval for high-recall candidate discovery,
      calibrates verification thresholds from the data, verifies local geometry
      with feature inliers, extracts a maximum spanning forest to keep the
      strongest navigation backbone, and reinserts strong loop closures to
      preserve useful cyclic structure.


      **BPL** performs odometry-free localization on the resulting 2D graph. It
      propagates belief through graph reachability, measures observation
      likelihood with visual descriptors, and fuses prediction and observation
      through entropy-adaptive weights so that uncertain observations can lean
      more heavily on topology.


      **BASS** turns the belief state into closed-loop navigation. It anchors
      the start and goal images on the graph, searches for the widest path whose
      weakest visual transition is maximized, sends sequential landmark subgoals
      to a local visual planner, and triggers replanning when the belief moves
      away from the intended route.
    image: /images/pipline.png
    image_alt: ULVN pipeline with RAVEL graph construction, BPL localization, and
      BASS planning
    caption: ULVN integrates graph construction, belief propagation localization,
      and belief-aware subgoal search.
  - title: Results
    body: >-
      On GRScenes, RAVEL achieves the strongest topological graph construction
      performance among the evaluated baselines, reaching **0.7104 precision**,
      **0.7656 recall**, **0.7365 F1**, and **0.9970 accuracy**. Compared with
      top-k retrieval and temporal-distance proxies, the calibrated geometric
      verification plus MSF refinement provides a better precision-recall
      balance for unordered maps.


      For global localization, BPL achieves **95.49%** accuracy in the global
      setting and **93.99%** on difficult paths with long routes, turns, and low
      start-goal visual overlap. Under viewpoint shifts, Gaussian noise, Poisson
      noise, and random cropping, BPL averages **0.930 +/- 0.040** localization
      accuracy across four datasets, outperforming MegaLoc, JIST, and ViNT.


      For navigation, ULVN improves over purely reactive baselines. Integrated
      with NoMaD, ULVN reaches **71.9% success rate**, **0.42 average
      collisions**, and **0.7978 SPL** on GRScenes; with ViNT, it reaches
      **68.1% success rate** and **0.8398 SPL**. The results indicate that
      lightweight topological memory reduces myopic oscillation and supports
      recovery from off-route execution.
  - title: Global Descriptors as Proxies for Geometric Verification
    body: We evaluate whether global descriptors can efficiently approximate costly
      geometric verification. On CARLA data, ResNet, DINOv2, and ViNT show weak
      or non-linear correlations with LightGlue+RANSAC geometric scores, while
      the VPR-trained MegaLoc exhibits a strong correlation, making it a
      reliable proxy for fast candidate retrieval.
    image: /images/ravelvisual.png
    image_alt: Affinity matrices and correlation plots comparing ResNet, DINOv2,
      ViNT, MegaLoc, LightGlue, and LightGlue+RANSAC scores on CARLA image
      pairs.
    caption: MegaLoc achieves substantially stronger correlation with geometric
      consistency than general-purpose or temporal features, demonstrating the
      importance of VPR-trained descriptors for efficient retrieval before
      geometric verification.
  - title: Mapping Performance Evaluation
    body: We compare RAVEL with retrieval-based baselines on GRScenes. Increasing
      Top-k improves recall but substantially reduces precision, while RAVEL
      achieves a better balance through structural verification, obtaining the
      highest precision, F1-score, and accuracy.
    image: /images/ravelresults.jpeg
    image_alt: Comparison of precision, recall, F1-score, and accuracy for VGGT,
      PlaceNav, ViNT, and RAVEL on GRScenes.
    caption: RAVEL achieves the best overall mapping performance, with the highest
      F1-score of 0.7365 and accuracy of 0.9970.
  - title: Robustness of RAVEL to Visual Perturbations
    body: We evaluate mapping robustness under lighting changes, noise, and motion
      blur. Retrieval-based methods suffer substantial precision and F1
      degradation, whereas RAVEL remains robust due to geometric verification
      and global structural constraints.
    image: /images/ravelrobust.jpeg
    image_alt: Robustness comparison of RAVEL, CosPlace, and ViNT under visual
      noise, reporting precision, recall, F1-score, and accuracy.
    caption: RAVEL shows the strongest robustness to visual perturbations, with only
      a 6.56% drop in F1-score while maintaining 0.9963 accuracy.
  - title: Global Localization Performance
    body: We compare BPL with MegaLoc, ViNT, and JIST on global localization. BPL
      achieves the highest accuracy on both overall and difficult trajectories,
      with particularly strong performance on challenging paths containing
      turns, intersections, and loops.
    image: /images/bplresults.jpeg
    image_alt: Comparison of localization success, failure, and accuracy for BPL,
      MegaLoc, ViNT, and JIST under all and difficult-path scenarios.
    caption: BPL achieves 95.49% overall accuracy and 93.99% on difficult paths,
      consistently outperforming competing localization methods.
  - title: Robustness to Perceptual Degradation
    body: We evaluate localization under viewpoint shifts, image noise, and
      structural cropping across four datasets. BPL consistently outperforms
      MegaLoc, JIST, and ViNT, maintaining high and stable accuracy under all
      degradation conditions.
    image: /images/bplrobust.jpeg
    image_alt: Localization accuracy of MegaLoc, JIST, ViNT, and BPL under rotation,
      Gaussian noise, Poisson noise, and cropping perturbations.
    caption: BPL achieves the best robustness across all visual degradations, with
      an average localization accuracy of 0.930 ± 0.040.
  - title: Navigation Performance Evaluation
    body: We compare ULVN with end-to-end baselines and different local planner
      variants. ULVN consistently improves navigation performance, with NoMaD
      achieving the highest success rate and lowest collision count, while ViNT
      achieves the best SPL.
    image: /images/bassresults.jpeg
    image_alt: Comparison of success rate, average collisions, and SPL for
      Uni-Navid, UniGoal, and ULVN variants with ViNT and NoMaD on GRScenes.
    caption: ULVN+NoMaD achieves the highest success rate of 71.9% and lowest
      average collisions of 0.42, while ULVN+ViNT obtains the best SPL of
      0.8398.
  - {}
  - title: Real-World Deployment
    body: ULVN was deployed on a Diablo wheeled robot equipped with an Azure Kinect
      camera and an NVIDIA Jetson Orin. In representative real-world trials, the
      robot followed a planned visual landmark route, detected physical
      deviation through the BPL belief state, and used BASS to replan from the
      off-route node to the goal. This validates the sim-to-real viability of
      RGB-only, odometry-free navigation from unordered landmarks.
